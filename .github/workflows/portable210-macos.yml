name: Portable 2.1 macOS qualification
on:
  push:
    branches: [ci/portable210-macos]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published native baseline
        run: python3 desk/tests/native_mac_portable210.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-portable210-evidence
          path: |
            evidence210/
            !evidence210/**/test-key.pem
