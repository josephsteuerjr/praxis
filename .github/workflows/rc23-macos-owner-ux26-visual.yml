name: Hélène RC23 macOS26 settled warning paint proof
on:
  push:
    branches: [codex/rc23-macos-0211]
    paths: [.github/workflows/rc23-macos-owner-ux26-visual.yml, desk/tests/rc23_macos_owner_ux26_visual_qa.py, desk/tests/rc23_macos_owner_ux26_visual_window.py]
permissions:
  contents: read
  actions: read
jobs:
  warning-paint26:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: subject
          ref: d299ac425a21980ce63f6f590cea831d8793b4a2
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/qualified-release-artifact.zip
          key: helene-rc18-complete-baa533b05f4b63c6-v2
          fail-on-cache-miss: true
      - name: Same exact sealed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/josephsteuerjr/praxis/actions/artifacts/13105805715/zip > "$RUNNER_TEMP/current-rc23-evidence.zip"
          gh api repos/josephsteuerjr/praxis/actions/artifacts/13109203623/zip > "$RUNNER_TEMP/owner-ux-sealed-evidence.zip"
      - name: Unmodified actual Programme card paint and opacity over several frames
        run: python3 qa/desk/tests/rc23_macos_owner_ux26_visual_qa.py prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helene-rc23-owner-ux-macos26-visual-evidence
          path: evidence-rc23-owner-ux26-visual/
