# Сборка Hélène для macOS (Apple Silicon).
#
# Что происходит: раннер macos-15 (arm64) собирает архив Helene-<v>-macos-arm64.zip
# скриптом desk/installer/build_mac.py (дерево агента — из Windows-архива того же
# выпуска; фронты, Rust, реле, тело тула `computer` из praxis/body, рантайм, git,
# бандлы, ad-hoc подпись, паспорт, секрет-гард), гоняет стенды Rust (оболочка,
# мастер, мост и тело — на настоящем Mac) и живые проверки ограды рантаймом
# сборки, ставит программу тихо в ~/Applications/Helene с включённым «Управлением
# компьютером», открывает её, снимает экран, дёргает канал и ждёт, пока тело
# подключится к мосту (data/memory/.state/body.json → connected: true); затем
# живые стенды тела бинарями сборки (t_body.py, t_body_macos.py — контракт тела
# на macOS: status, снимок, окна, процессы, буфер обмена, дерево окна). Архив,
# сумма, install.sh, паспорт, снимок и журналы (включая журналы тела) — в
# артефактах прогона.
#
# Разрешения TCC («Запись экрана», «Универсальный доступ») у процессов раннера —
# какие есть: стенды тела печатают отказ словами и не падают на нём; падают они
# на лжи (снимок «ok» без разрешения) и на поломке (разрешение есть, а тело
# не отвечает).
#
# ⚠⚠ АРТЕФАКТ PUSH-ПРОГОНА В ВЫПУСК НЕ КЛАДЁТСЯ. Дерево агента (`tree/`, `server/`)
# сборка берёт из Windows-архива выпуска TREE_TAG, а называет архив по TAG. На push
# выпуска новой версии ещё нет, поэтому TREE_TAG отстаёт (сейчас v0.8.2) — внутри
# такого архива дерево ПРОШЛОЙ версии, а имя файла обещает новую. Выложить его
# значило бы отдать людям выпуск с чужим деревом. Поэтому:
#   · шаг «Выложить в выпуск» стоит на гарде `[ "$TREE_TAG" = "$TAG" ]`;
#   · артефакт такого прогона и НАЗЫВАЕТСЯ не по-выпускному:
#     `Helene-<TAG>-macos-arm64-tree-<TREE_TAG>` (шаг «Имя артефакта») — чтобы скачавший
#     не принял его за готовую сборку выпуска;
#   · проверить у любого архива: `helene-build.json` → `source_release.tag` обязан
#     совпасть с `version`.
# Выкладка — ТОЛЬКО кнопкой и только после влития в `main` (`workflow_dispatch`
# GitHub видит только с ветки по умолчанию):
#       gh workflow run macos.yml -f tag=v0.8.3 -f upload=true
#       — тот же прогон, плюс шаг «Выложить в выпуск» (--clobber в тот же тег;
#       Windows-архив не трогается).
# Прогон от push в port/macos или port/macos-body — проверочный: inputs на push
# пусты, выкладки не будет, артефакт смотрят глазами (`gh run download <id>`).
name: macOS (Apple Silicon)

on:
  push:
    branches: [port/macos, port/macos-body]
  workflow_dispatch:
    inputs:
      tag:
        description: "Выпуск: чьё дерево агента берём и куда выкладываем"
        type: string
        default: v0.8.3
        required: true
      upload:
        description: "Выложить архив, .sha256 и install.sh в этот выпуск (--clobber)"
        type: boolean
        default: false

# contents: write нужен только шагу выкладки; чтение выпуска идёт и без него.
permissions:
  contents: write

jobs:
  build:
    name: Сборка, стенды, дымовой запуск
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      # На push inputs пусты — тег по умолчанию тот же, что у build_mac.py.
      TAG: ${{ inputs.tag || 'v0.8.3' }}
      # Откуда дерево агента: Windows-архив ЭТОГО выпуска. На push (проверочный
      # прогон) выпуска новой версии ещё нет — дерево берётся из последнего
      # существующего (тот же снимок прода), а сборка называется по TAG.
      # Выкладка (кнопка) требует TREE_TAG == TAG — см. шаг «Выложить в выпуск».
      TREE_TAG: ${{ inputs.tag || 'v0.8.2' }}
      HOME_DIR: /Users/runner/Applications/Helene
    steps:
      - uses: actions/checkout@v4

      # Контекст `runner` в env на уровне job недоступен — GitHub отвергает
      # файл ещё до запуска, без единой задачи (так падали круги 1 и 4).
      # Временные пути объявляются первым шагом.
      - name: Пути сборки
        run: |
          echo "BUILD=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
          echo "LOGS=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"

      # Имя артефакта — рядом с путями, а не у самой выкладки: шаг артефакта
      # идёт с `if: always()`, и на красном прогоне переменная обязана уже быть.
      #
      # Когда дерево агента приехало из ДРУГОГО выпуска (TREE_TAG != TAG —
      # так на каждом push, пока выпуска новой версии ещё нет), имя артефакта
      # говорит это вслух. Скачавший `Helene-v0.8.3-macos-arm64` вправе считать,
      # что держит сборку выпуска v0.8.3; `…-tree-v0.8.2` такого не обещает.
      - name: Имя артефакта
        run: |
          if [ "$TREE_TAG" = "$TAG" ]; then
            echo "ARTIFACT_NAME=Helene-$TAG-macos-arm64" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_NAME=Helene-$TAG-macos-arm64-tree-$TREE_TAG" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@stable

      # cache-on-failure: красный прогон тоже сохраняет кэш cargo — иначе каждый
      # следующий круг после падения начинал бы компиляцию с нуля.
      # Тело (praxis/body) собирается с --target-dir в кэше сборки, не в своём
      # target/: каталог назван в cache-directories, а workspace — чтобы его
      # Cargo.lock входил в ключ кэша. `runner` в `with:` шага доступен (в env
      # job — нет, см. выше).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desk/shell
            desk/setup
            desk/svc
            praxis/body
          cache-directories: |
            ${{ runner.temp }}/build/cache/body-target
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Все пять фронтов (build_mac.FRONTS): пульт и мини-апп в архив не
          # едут, но стенд пакета desk собирает и серверный вид.
          cache-dependency-path: |
            desk/app/package-lock.json
            desk/mobile/package-lock.json
            desk/setup/ui/package-lock.json
            desk/pult/package-lock.json
            desk/miniapp/package-lock.json

      - name: Сборка (build_mac.py)
        run: python3 desk/installer/build_mac.py --from-release "$TREE_TAG" --tag "$TAG" --out "$BUILD"

      # Стенды питона и окна сборка уже прогнала рантаймом, который собрала
      # (build_mac.run_stands). Здесь — то, чего она не зовёт: Rust трёх крейтов.
      # Служба с 0.8.0 собирается и на macOS (`svc/src/daemon.rs`, демон launchd),
      # и её стенды — сборка plist, строки launchctl, разбор состояния — идут
      # здесь же.
      - name: Стенды Rust (shell, setup, svc)
        run: |
          (cd desk/shell && cargo test --features custom-protocol)
          (cd desk/setup && cargo test --features custom-protocol)
          (cd desk/svc && cargo test)

      # Стенды моста и тела — на настоящем Mac: чистые функции под cfg(test) и
      # живые под cfg(all(test, target_os = "macos")) (с честным пропуском без
      # TCC). Тот же --target-dir, что у сборки (build_mac.body_target_dir):
      # зависимости не компилируются второй раз и кэшируются вместе с ним.
      - name: Стенды тела (cargo test -p praxis-body -p praxis-bridge)
        run: |
          cd praxis/body
          cargo test -p praxis-body -p praxis-bridge --target-dir "$BUILD/cache/body-target"

      - name: Ограда seatbelt — живые проверки рантаймом сборки
        run: |
          cd desk
          "$BUILD/Helene/runtime/bin/python3" tests/t_fence_macos.py

      # Тихая установка из собранной папки — тем же мастером и тем же JSON, что
      # у человека. Провайдер «локальная модель»: ключа у неё нет по построению,
      # а адрес никуда не ведёт — окно и канал должны подняться и без модели.
      # "computer": true — «Управление компьютером» включено; "service": true —
      # ставим демон launchd. Прав администратора мастер просит тем же путём,
      # что и у человека (`mac_svc_run_admin`), только на раннере проходит
      # `sudo -n` и системного диалога пароля не будет.
      # shell: bash даёт `-eo pipefail`: отказ внутри конвейера не глотается.
      - name: Тихая установка в ~/Applications/Helene
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/decisions.json" <<EOF
          {
            "agent": "Проба",
            "owner": "GitHub Actions",
            "constitution": "Проверочный запуск сборки на раннере. Настоящей конституции здесь нет.",
            "accepted": true,
            "provider": "local",
            "api": {"base_url": "", "model": "", "key": ""},
            "local": {"base_url": "http://127.0.0.1:11434/v1", "model": "smoke"},
            "telegram": {"bot_token": "", "owner_id": ""},
            "agent_mode": "sandbox",
            "service": true,
            "computer": true,
            "dir": "$HOME_DIR"
          }
          EOF
          "$BUILD/Helene/Helene Setup.app/Contents/MacOS/helene-setup" --install "$RUNNER_TEMP/decisions.json" --quiet
          test -f "$HOME_DIR/helene.json" || { echo "после установки нет $HOME_DIR/helene.json"; exit 1; }
          test -f "$HOME_DIR/helene-build.json" || { echo "после установки нет паспорта в корне"; exit 1; }
          for exe in helene-bridge helene-body helene-svc; do
            test -x "$HOME_DIR/$exe" || { echo "после установки нет исполняемого $HOME_DIR/$exe"; exit 1; }
          done
          python3 -c 'import json,sys; c=json.load(open(sys.argv[1], encoding="utf-8-sig")); sys.exit(0 if (c.get("computer") or {}).get("enabled") is True else 1)' "$HOME_DIR/helene.json" \
            || { echo "мастер не записал computer.enabled=true в helene.json (decisions.json просил computer: true)"; cat "$HOME_DIR/helene.json"; exit 1; }

      # Служба без входа в систему: движок и реле живут под launchd, окна нет.
      # Порядок нарочно такой — сначала служба одна, потом окно: иначе нельзя
      # отличить «канал держит демон» от «канал держит окно».
      - name: Служба — канал отвечает без окна
        shell: bash
        run: |
          PLIST=/Library/LaunchDaemons/app.helene.svc.plist
          # Описание собрал сам helene-svc при установке — печатаем, что легло.
          test -f "$PLIST" || { echo "мастер не положил описание демона в $PLIST"; exit 1; }
          echo "=== $PLIST"
          sudo cat "$PLIST"
          ls -l "$PLIST"
          # Мастер ставил демон через sudo -n; повторно грузить не надо, но если
          # launchd его почему-то не держит — грузим руками и говорим об этом.
          if ! sudo launchctl print system/app.helene.svc > "$RUNNER_TEMP/launchctl.txt" 2>&1; then
            echo "демон не загружен после установки — гружу руками:"
            cat "$RUNNER_TEMP/launchctl.txt"
            sudo launchctl bootstrap system "$PLIST"
            sudo launchctl print system/app.helene.svc > "$RUNNER_TEMP/launchctl.txt" 2>&1
          fi
          head -n 30 "$RUNNER_TEMP/launchctl.txt"
          # ⚠ Читает ли `launchctl print` обычный пользователь — живьём не
          # проверялось; окно на этом НЕ держится (`mac_svc_state_words` отвечает
          # `unknown`, а не выдуманным «нет»). Здесь просто печатаем ответ.
          echo "launchctl print без sudo:"
          launchctl print system/app.helene.svc > "$RUNNER_TEMP/launchctl-user.txt" 2>&1 \
            && head -n 5 "$RUNNER_TEMP/launchctl-user.txt" \
            || echo "  обычному пользователю отказано (код $?) — это состояние, а не сбой"
          PORT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("port", 8094))' "$HOME_DIR/helene.json")"
          TOKEN_FILE="$HOME_DIR/data/memory/.state/desk-token"
          ok=0
          for i in $(seq 1 60); do
            if [ -f "$TOKEN_FILE" ] && curl -fsS --max-time 5 "http://127.0.0.1:$PORT/api/health?key=$(cat "$TOKEN_FILE")" > "$RUNNER_TEMP/health-svc.json" 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "канал службы не ответил за 120 с — окна не открывалось, поднять его было некому"
            for f in "$HOME_DIR/data/service.log" "$HOME_DIR/data/deskapp.log" "$HOME_DIR/data/runner.log"; do
              if [ -f "$f" ]; then echo "=== $f (хвост)"; tail -n 60 "$f"; else echo "=== $f: нет"; fi
            done
            exit 1
          fi
          echo "канал службы отвечает на $PORT без окна:"
          cat "$RUNNER_TEMP/health-svc.json"; echo
          echo "=== data/service.log (хвост)"
          tail -n 40 "$HOME_DIR/data/service.log" || true
          # Тела под службой быть НЕ ДОЛЖНО: у процесса вне графической сессии
          # нет ни рабочего стола, ни разрешений TCC. Зато обязан лежать ключ
          # устройства для окна — по нему окно и поднимет тело.
          BODY_STATE="$HOME_DIR/data/memory/.state/body.json"
          # Снимок сторожа пишется после пробы тела через мост, а не в момент
          # подъёма движка, и канал успевает ответить раньше него (прогон 20.09:
          # демон поднят в :06, канал ответил в :07, снимка ещё не было). Ждём
          # до 30 с — та же гонка, что в дымовом шаге (2c326c6).
          for i in $(seq 1 30); do
            [ -f "$BODY_STATE" ] && break
            sleep 1
          done
          test -f "$BODY_STATE" || { echo "движок под службой не написал $BODY_STATE за 30 с"; tail -n 40 "$HOME_DIR/data/service.log" 2>/dev/null; exit 1; }
          echo "снимок сторожа появился (ждали $i с)"
          cat "$BODY_STATE"; echo
          python3 - "$BODY_STATE" <<'PY'
          import json, sys
          snap = json.load(open(sys.argv[1], encoding="utf-8"))
          assert snap.get("service") is True, f"снимок не помечен службой: {snap.get('service')!r}"
          assert snap.get("body_pid") in (0, None), f"движок службы поднял тело: pid {snap.get('body_pid')}"
          assert "окно Helene" in str(snap.get("reason")), f"снимок молчит про окно: {snap.get('reason')!r}"
          PY
          TOKEN_BODY="$HOME_DIR/data/memory/.state/body-token"
          test -s "$TOKEN_BODY" || { echo "движок службы не положил ключ устройства $TOKEN_BODY"; exit 1; }
          MODE="$(stat -f %Lp "$TOKEN_BODY")"
          test "$MODE" = "600" || { echo "ключ устройства открыт соседям: права $MODE, ждали 600"; exit 1; }
          echo "ключ устройства на месте, права $MODE"

      - name: Дымовой запуск — окно, снимок экрана, канал
        shell: bash
        run: |
          open "$HOME_DIR/Helene.app"
          sleep 20
          screencapture -x "$RUNNER_TEMP/window.png" || echo "снимок экрана не снялся"
          # Пустой снимок (без окна) — это несколько килобайт: не падаем, но
          # говорим вслух, и рядом — кто вообще виден на экране раннера.
          if [ -f "$RUNNER_TEMP/window.png" ]; then
            size="$(stat -f %z "$RUNNER_TEMP/window.png")"
            if [ "$size" -lt 10240 ]; then
              echo "снимок экрана подозрительно мал ($size байт) — скорее всего пустой, окна на нём нет"
            else
              echo "снимок экрана: $size байт"
            fi
          fi
          echo "видимые процессы:"
          osascript -e 'tell application "System Events" to get name of every process whose visible is true' || true
          PORT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("port", 8094))' "$HOME_DIR/helene.json")"
          TOKEN_FILE="$HOME_DIR/data/memory/.state/desk-token"
          test -f "$TOKEN_FILE" || { echo "оболочка не завела секрет канала: $TOKEN_FILE"; ls -la "$HOME_DIR/data" || true; exit 1; }
          TOKEN="$(cat "$TOKEN_FILE")"
          echo "канал на порту $PORT"
          curl -fsS --max-time 10 "http://127.0.0.1:$PORT/api/health?key=$TOKEN"
          echo
          # В файл, а не head-ом в конвейере: под pipefail обрезанный конвейер валил бы шаг.
          curl -fsS --max-time 10 -o "$RUNNER_TEMP/state.json" "http://127.0.0.1:$PORT/api/state?key=$TOKEN"
          head -c 2000 "$RUNNER_TEMP/state.json"
          echo
          # Окно обязано стать КЛИЕНТОМ: движок и канал держит служба, своих
          # детей окно не поднимает. Слова об этом — в helene.log; молчание там
          # означало бы второй движок на одном дереве (мина порта 8094).
          sleep 5
          if [ -f "$HOME_DIR/helene.log" ]; then
            echo "=== helene.log (хвост)"; tail -n 40 "$HOME_DIR/helene.log"
          fi
          grep -q "подключаюсь без своих детей" "$HOME_DIR/helene.log" \
            || { echo "окно не назвало себя клиентом — похоже, подняло свою пару детей поверх службы"; exit 1; }
          # Тело: под службой его поднимает ОКНО (helene-body connect, ключ из
          # memory/.state/body-token через среду). Сторож движка пишет
          # data/memory/.state/body.json по своей пробе body.status через мост —
          # это единственное честное «подключено». Ждём connected: true до 40 с;
          # иначе снимок состояния, хвосты журналов тела и падение.
          BODY_STATE="$HOME_DIR/data/memory/.state/body.json"
          connected=0
          for i in $(seq 1 40); do
            if [ -f "$BODY_STATE" ] && python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1], encoding="utf-8")).get("connected") is True else 1)' "$BODY_STATE" 2>/dev/null; then
              connected=1
              break
            fi
            sleep 1
          done
          if [ "$connected" -eq 1 ]; then
            echo "тело подключено к мосту окном под службой (ждали $i с):"
            cat "$BODY_STATE"
            echo
            pgrep -f "$HOME_DIR/helene-body" > /dev/null \
              || { echo "connected: true, а процесса тела нет — снимок врёт"; exit 1; }
          else
            echo "тело НЕ подключилось за 40 с (под службой его поднимает окно)"
            if [ -f "$BODY_STATE" ]; then cat "$BODY_STATE"; echo; else echo "(нет $BODY_STATE — движок тело не поднимал)"; fi
            for f in "$HOME_DIR/data/body/bridge.log" "$HOME_DIR/data/body/body.log" "$HOME_DIR/data/runner.log"; do
              if [ -f "$f" ]; then echo "=== $f (хвост)"; tail -n 60 "$f"; else echo "=== $f: нет"; fi
            done
            exit 1
          fi

      # Живые стенды тела — рантаймом сборки и бинарями из неё (HELENE_BODY_DIR):
      # t_body.py поднимает свой мост и тело на другом порту и спрашивает
      # desktop.status; t_body_macos.py проходит контракт тела на macOS (§2 плана
      # 19.09): status → platform/tcc/hints, снимок экрана (ok + PNG > 10 КБ или
      # честный отказ), список окон, процессы, буфер обмена туда-обратно, дерево
      # окна Helene по pid. Идёт ПОСЛЕ дымового запуска нарочно: окно Helene.app
      # уже на экране, и дерево читается с него. Без разрешений TCC у раннера
      # стенд печатает отказы словами; падает на лжи и на поломке.
      - name: Тело — живые стенды рантаймом сборки
        shell: bash
        run: |
          cd desk
          export HELENE_BODY_DIR="$BUILD/Helene"
          "$BUILD/Helene/runtime/bin/python3" tests/t_body.py
          "$BUILD/Helene/runtime/bin/python3" tests/t_body_macos.py

      # Обновление ПОВЕРХ установленного — тем же `install.sh`, которым обновляется
      # человек (и которым окно обновляет само себя). До 0.8.0 раннер ставил только
      # НАЧИСТО, и «обновление со службой» оставалось словами документа.
      #
      # Тихий путь: `helene.json` на месте → install.sh идёт веткой `update`,
      # решения читает из установленного конфига (`decisions_json`: служба — из
      # `installed.service`, «Управление компьютером» — из `computer.enabled`) и
      # зовёт мастер `--install <json> --quiet`. Мастер СНИМАЕТ демон до
      # копирования (иначе launchd держит старый `helene-svc` в той же папке) и
      # СТАВИТ его заново после.
      #
      # ⚠ Чего этот шаг НЕ проверяет: ДИАЛОГ ПАРОЛЯ. На раннере `GITHUB_ACTIONS=true`
      # и sudo без пароля, поэтому оба административных шага проходят молча
      # (`mac_svc_run_admin` → sudo). У человека это два системных диалога подряд;
      # фоновый путь (окно запускает install.sh отсоединённо) не проверен вовсе.
      - name: Обновление поверх установленного (install.sh --from)
        shell: bash
        run: |
          TOKEN_FILE="$HOME_DIR/data/memory/.state/desk-token"
          BEFORE="$(cat "$TOKEN_FILE")"
          test -n "$BEFORE" || { echo "до обновления нет ключа канала $TOKEN_FILE"; exit 1; }
          UPDLOG="$RUNNER_TEMP/update.log"
          # Код возврата ловим сами: под pipefail и -e отказ install.sh оборвал бы
          # шаг раньше, чем мы успеем показать его журнал.
          set +e
          sh "$BUILD/Helene/install.sh" --from "$BUILD"/Helene-*-macos-arm64.zip > "$UPDLOG" 2>&1
          rc=$?
          set -e
          mkdir -p "$LOGS"
          cp "$UPDLOG" "$LOGS/update.log" 2>/dev/null || true
          echo "=== install.sh (хвост)"
          tail -n 60 "$UPDLOG"
          [ "$rc" -eq 0 ] || { echo "install.sh вернул $rc — обновление не прошло"; exit 1; }
          grep -q "обновляю поверх" "$UPDLOG" \
            || { echo "install.sh пошёл НЕ веткой обновления — проверять было нечего"; exit 1; }
          grep -q "обновлено до" "$UPDLOG" \
            || { echo "тихое обновление не доложило об успехе"; exit 1; }
          # helene.json цел: обновление не трогает ни настройки, ни решение о службе.
          python3 - "$HOME_DIR/helene.json" <<'PY'
          import json, sys
          cfg = json.load(open(sys.argv[1], encoding="utf-8-sig"))
          got = (cfg.get("computer") or {}).get("enabled")
          assert got is True, f"обновление потеряло computer.enabled: {got!r}"
          got = (cfg.get("installed") or {}).get("service")
          assert got is True, f"обновление потеряло installed.service: {got!r}"
          print("helene.json цел: computer.enabled=true, installed.service=true")
          PY
          # data/ цела: ключ канала тот же байт в байт (новый значил бы, что
          # обновление переписало .state, то есть тронуло память агента).
          AFTER="$(cat "$TOKEN_FILE")"
          test "$AFTER" = "$BEFORE" \
            || { echo "ключ канала после обновления другой — обновление тронуло data/"; exit 1; }
          echo "data/ цела: ключ канала тот же"
          # Паспорт в корне — от НОВОЙ поставки, а не оставшийся от прежней.
          python3 - "$HOME_DIR/helene-build.json" "$BUILD/Helene/helene-build.json" <<'PY'
          import json, sys
          live = json.load(open(sys.argv[1], encoding="utf-8"))
          fresh = json.load(open(sys.argv[2], encoding="utf-8"))
          assert live == fresh, (
              "паспорт в корне не от свежей поставки: "
              f"version {live.get('version')!r} / {fresh.get('version')!r}, "
              f"git.desk {(live.get('git') or {}).get('desk')!r} / {(fresh.get('git') or {}).get('desk')!r}")
          print(f"паспорт в корне новый: {live.get('version')}")
          PY
          # Служба снова работает: мастер поставил демон заново, launchd его держит.
          up=0
          for i in $(seq 1 30); do
            if sudo launchctl print system/app.helene.svc > "$RUNNER_TEMP/launchctl-upd.txt" 2>&1; then
              up=1
              break
            fi
            sleep 2
          done
          if [ "$up" -ne 1 ]; then
            echo "после обновления демон app.helene.svc не загружен — мастер снял его и не поставил обратно"
            tail -n 30 "$RUNNER_TEMP/launchctl-upd.txt"
            tail -n 60 "$HOME_DIR/data/service.log" 2>/dev/null || echo "(журнала службы нет)"
            exit 1
          fi
          echo "демон загружен снова (ждали $i попыток по 2 с)"
          # И канал отвечает — уже от нового бинаря, без открытого окна.
          PORT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("port", 8094))' "$HOME_DIR/helene.json")"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "http://127.0.0.1:$PORT/api/health?key=$BEFORE" > "$RUNNER_TEMP/health-upd.json" 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "канал после обновления не ответил за 120 с на порту $PORT"
            tail -n 60 "$HOME_DIR/data/service.log" 2>/dev/null || echo "(журнала службы нет)"
            tail -n 60 "$HOME_DIR/data/deskapp.log" 2>/dev/null || echo "(журнала канала нет)"
            exit 1
          fi
          echo "канал после обновления отвечает на $PORT:"
          cat "$RUNNER_TEMP/health-upd.json"; echo

      # Ограда install.sh на живом Mac — случай 20.09: человек обновлялся из
      # Терминала одного пользователя после `su` в другого; скрипт искал установку
      # в доме второго, пошёл «первой установкой», а мастер через `open` стартовал
      # от первого и не смог прочитать папку второго («you don't have permission
      # to view it») — после 224 МБ закачки. Теперь check_session отказывает
      # словами до закачки: под sudo, после su и без графической сессии. Второго
      # пользователя создаёт sysadminctl; раннер одноразовый. Скрипт и проба —
      # в /tmp: дом раннера для чужого пользователя может быть закрыт, а падать
      # стенд должен на словах ограды, не на «cannot open».
      - name: install.sh — отказ словами под sudo и после su
        shell: bash
        run: |
          set -- "$BUILD"/Helene-*-macos-arm64.zip
          ZIP="$1"
          test -f "$ZIP" || { echo "нет архива сборки: $ZIP"; exit 1; }
          cp "$BUILD/Helene/install.sh" /tmp/helene-install.sh
          chmod 644 /tmp/helene-install.sh
          cat > /tmp/helene-probe.sh <<'EOF'
          uid="$(id -u)"
          echo "id -u=$uid ($(id -un)) manageruid=$(launchctl manageruid 2>&1) managername=$(launchctl managername 2>&1) console=$(stat -f %Su /dev/console 2>&1)"
          if launchctl print "gui/$uid" >/dev/null 2>&1; then echo "gui/$uid: есть"; else echo "gui/$uid: нет"; fi
          EOF
          chmod 644 /tmp/helene-probe.sh
          echo "=== сессия раннера"; sh /tmp/helene-probe.sh
          echo "=== сессия под sudo -n"; sudo -n sh /tmp/helene-probe.sh
          set +e
          OUT="$(sudo -n sh /tmp/helene-install.sh --from "$ZIP" 2>&1)"; rc=$?
          set -e
          echo "=== sudo -n sh install.sh --from … → код $rc"; echo "$OUT"
          [ "$rc" -ne 0 ] || { echo "под sudo install.sh НЕ отказал"; exit 1; }
          grep -q "без sudo" <<<"$OUT" || { echo "отказ под sudo без слов «без sudo»"; exit 1; }
          ! grep -q "распаковываю" <<<"$OUT" || { echo "под sudo скрипт дошёл до распаковки"; exit 1; }
          if sudo -n sysadminctl -addUser helenesu -fullName "Helene su-проба" -password "helene-su-1" -home /Users/helenesu > "$RUNNER_TEMP/adduser.log" 2>&1; then
            sudo -n createhomedir -c -u helenesu > /dev/null 2>&1 || true
            echo "=== сессия после sudo su helenesu"; sudo -n su helenesu -c "sh /tmp/helene-probe.sh"
            set +e
            OUT="$(sudo -n su helenesu -c "sh /tmp/helene-install.sh --from '$ZIP'" 2>&1)"; rc=$?
            set -e
            echo "=== sudo -n su helenesu -c 'sh install.sh --from …' → код $rc"; echo "$OUT"
            [ "$rc" -ne 0 ] || { echo "после su install.sh НЕ отказал"; exit 1; }
            grep -q -e "после su" -e "нет входа на экран" <<<"$OUT" || { echo "отказ после su без слов о сессии"; exit 1; }
            ! grep -q "распаковываю" <<<"$OUT" || { echo "после su скрипт дошёл до распаковки"; exit 1; }
            sudo -n sysadminctl -deleteUser helenesu > /dev/null 2>&1 || true
          else
            echo "⚠ sysadminctl не создал второго пользователя — проба su пропущена (sudo проверен):"
            cat "$RUNNER_TEMP/adduser.log"
          fi

      # Снятие: `bootout` выгружает демон вместе с детьми (SIGTERM → демон →
      # killpg по группам). Проверяем, что он действительно ушёл и что порт
      # освободился — забытый демон с KeepAlive поднимал бы движок из удалённой
      # папки при каждой загрузке.
      - name: Служба — снятие
        if: always()
        shell: bash
        run: |
          echo "=== data/service.log (хвост перед снятием)"
          tail -n 40 "$HOME_DIR/data/service.log" 2>/dev/null || echo "(журнала службы нет)"
          sudo launchctl bootout system/app.helene.svc || echo "bootout ответил отказом (код $?)"
          gone=0
          for i in $(seq 1 15); do
            if ! sudo launchctl print system/app.helene.svc > /dev/null 2>&1; then
              gone=1
              break
            fi
            sleep 1
          done
          # В файл, а не head-ом в конвейере: под pipefail обрезанный конвейер
          # валил бы шаг раньше, чем мы успеем сказать причину.
          if [ "$gone" -ne 1 ]; then
            echo "демон остался загруженным после bootout"
            sudo launchctl print system/app.helene.svc > "$RUNNER_TEMP/launchctl-after.txt" 2>&1 || true
            head -n 30 "$RUNNER_TEMP/launchctl-after.txt"
            exit 1
          fi
          echo "демон выгружен (ждали $i с)"
          # Дети демона уходят вместе с ним: канал на порту больше не отвечает.
          # Шаг идёт с `if: always()`, и установки могло не случиться вовсе —
          # тогда проверять нечего, а падать здесь значило бы прятать настоящую
          # причину красного прогона.
          test -f "$HOME_DIR/helene.json" || { echo "установки нет — проверять порт нечем"; exit 0; }
          PORT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("port", 8094))' "$HOME_DIR/helene.json")"
          for i in $(seq 1 15); do
            pgrep -f "$HOME_DIR/app/deskapp.py" > /dev/null || break
            sleep 1
          done
          if pgrep -f "$HOME_DIR/app/deskapp.py" > /dev/null; then
            echo "⚠ канал ещё жив — его мог поднять уже само окно (оно открыто и видит свободный порт)"
            ps -axo pid=,command= | grep "$HOME_DIR" | grep -v grep || true
          fi
          echo "порт $PORT: $(nc -z 127.0.0.1 "$PORT" && echo занят || echo свободен)"

      - name: Журналы
        if: always()
        run: |
          mkdir -p "$LOGS"
          # install.log мастер кладёт в корень поставки (папку с helene-build.json).
          # Журналы тела — data/body/: bridge.log и body.log, плюс снимок состояния
          # сторожа memory/.state/body.json (без токенов: их на диске нет).
          # data/service.log — журнал демона launchd: туда же launchd сливает его
          # stdout и stderr (StandardOutPath в описании).
          # ⚠ body-token в артефакт НЕ кладём: это живой ключ к телу.
          for f in "$HOME_DIR/helene.log" "$HOME_DIR/data/deskapp.log" "$HOME_DIR/data/runner.log" \
                   "$HOME_DIR/data/service.log" \
                   "$HOME_DIR/data/body/bridge.log" "$HOME_DIR/data/body/body.log" \
                   "$HOME_DIR/data/memory/.state/body.json" "$BUILD/Helene/install.log"; do
            if [ -f "$f" ]; then
              echo "=== $f (хвост)"; tail -n 80 "$f"
              cp "$f" "$LOGS/$(basename "$f")"
            else
              echo "=== $f: нет"
            fi
          done
          pkill -f "$HOME_DIR/" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/build/Helene-*-macos-arm64.zip
            ${{ runner.temp }}/build/Helene-*-macos-arm64.zip.sha256
            ${{ runner.temp }}/build/install.sh
            ${{ runner.temp }}/build/Helene/helene-build.json
            ${{ runner.temp }}/window.png
            ${{ runner.temp }}/logs/

      # Только по кнопке и только с upload=true: на push inputs пусты, и шаг не
      # идёт. В тот же выпуск, Windows-архив не трогается. --clobber: повторный
      # прогон заменяет прежнюю Mac-сборку, а не падает на «asset already exists».
      - name: Выложить в выпуск
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        run: |
          [ "$TREE_TAG" = "$TAG" ] || { echo "дерево из $TREE_TAG, а выпуск $TAG — такой архив не выкладывается"; exit 1; }
          gh release upload "$TAG" \
            "$BUILD"/Helene-*-macos-arm64.zip \
            "$BUILD"/Helene-*-macos-arm64.zip.sha256 \
            "$BUILD"/install.sh \
            --clobber --repo josephsteuerjr/praxis
