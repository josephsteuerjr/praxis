name: Hélène RC18 exact complete archive native OS qualification
on:
  push:
    branches: [codex/rc18-macos-0111]
    paths: [desk/tests/macos_distribution_qualification.py, .github/workflows/rc18-macos-matrix.yml]
permissions:
  contents: read
  actions: read
jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CANDIDATE_SHA256: 43115b145684a98554d3adcbb129580ab9fd783502ac183dbc412576b3a67d88
      ARTIFACT_SHA256: ed89bd6a5d081f6f4f440e79c3f6b393534e255bbfbbec75e134c90249586b8a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: archive
        with:
          path: ${{ runner.temp }}/qualified-release-artifact.zip
          key: helene-rc18-complete-43115b145684a985
      - if: steps.archive.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/josephsteuerjr/praxis/actions/artifacts/13078364189/zip > "$RUNNER_TEMP/qualified-release-artifact.zip"
      - uses: actions/cache/save@v4
        if: steps.archive.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/qualified-release-artifact.zip
          key: helene-rc18-complete-43115b145684a985
      - name: Exact archive, isolated runtime, native GUI and distribution policy
        run: python3 desk/tests/macos_distribution_qualification.py prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helene-rc18-${{ matrix.os }}-evidence
          path: |
            evidence-distribution/
            evidence-rc18/
