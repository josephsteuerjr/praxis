name: Hélène RC18 extended macOS qualification
on:
  push:
    branches: [codex/rc18-macos-0111]
permissions:
  contents: read
  actions: read
concurrency:
  group: rc18-python-macos
  cancel-in-progress: false
jobs:
  broad:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        id: candidate-cache
        with:
          path: ${{ runner.temp }}/rc18-qualified-input.zip
          key: helene-rc18-native-79ce64094f84499c
      - name: Reuse fixed native input
        if: steps.candidate-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/josephsteuerjr/praxis/actions/artifacts/13077655662/zip > "$RUNNER_TEMP/rc18-qualified-input.zip"
      - name: Full native source discovery and observations
        run: python3 desk/tests/extended_macos.py broad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helene-rc18-macos-broad
          path: evidence-extended/
          retention-days: 30
