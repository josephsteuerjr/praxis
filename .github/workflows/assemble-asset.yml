name: Deliver exact Hélène 2.2.10 assets
run-name: helene-210-exact-delivery
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: helene-210-exact-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconstruct and upload exact approved bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u desk/installer/release-delivery-210/runner.py
