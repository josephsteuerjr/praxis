name: Deliver qualified HГ©lГЁne archives
run-name: HГ©lГЁne 2.2.17 exact delivery
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: helene-release-217-delivery
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deliver exact qualified bytes and verify anonymous public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u _delivery217/delivery_runner.py
      - name: Retain publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helene-217-publication-receipts
          path: |
            _delivery217/manifest.json
            _delivery217/public-verification.json
            _delivery217/COMPLETE.json
          if-no-files-found: error
