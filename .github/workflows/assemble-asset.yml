name: Deliver qualified Hélène archives
run-name: Hélène 2.2.12 exact delivery
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: helene-release-212-delivery
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deliver exact qualified bytes and verify anonymous public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u _delivery212/delivery_runner.py
      - name: Retain publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helene-212-publication-receipts
          path: |
            _delivery212/manifest.json
            _delivery212/public-verification.json
            _delivery212/COMPLETE.json
          if-no-files-found: error
