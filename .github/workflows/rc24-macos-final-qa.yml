name: Hélène RC24 accepted source delta and native Darwin policy
on:
  push:
    branches: [codex/rc23-macos-0211]
    paths: [.github/workflows/rc24-macos-final-qa.yml, desk/tests/rc24_macos_final_qa.py, desk/tests/rc24_platform_guard_qa.py, desk/tests/rc24_darwin_policy_expected.json]
permissions:
  contents: read
  actions: read
jobs:
  affected:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RC24_LANE: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: subject
          ref: 1851d9f101476023e836d6195d9267d0c4495b3e
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/qualified-release-artifact.zip
          key: helene-rc18-complete-baa533b05f4b63c6-v2
          fail-on-cache-miss: true
      - name: Restore exact qualified Runtime from cached immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/josephsteuerjr/praxis/actions/artifacts/13105805715/zip > "$RUNNER_TEMP/current-rc23-evidence.zip"
          gh api repos/josephsteuerjr/praxis/actions/artifacts/13109203623/zip > "$RUNNER_TEMP/owner-ux-sealed-evidence.zip"
      - name: Only accepted9path native checks and source-bound Darwin policy facts
        run: python3 qa/desk/tests/rc24_macos_final_qa.py prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helene-rc24-final-${{ matrix.os }}-evidence
          path: evidence-rc24-final-${{ matrix.os }}/
