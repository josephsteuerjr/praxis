name: Hélène RC23 scoped native source checks
on:
  push:
    branches: [codex/rc23-macos-0211]
    paths: [.github/workflows/rc23-macos-source-delta.yml, desk/tests/rc23_macos_source_delta.py]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: macos-15
    env:
      RC23_SCOPE: settings-and-common
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: old
        with:
          path: ${{ runner.temp }}/qualified-release-artifact.zip
          key: helene-rc18-complete-baa533b05f4b63c6-v2
      - if: steps.old.outputs.cache-hit != 'true'
        name: Reuse the previously qualified runtime artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/josephsteuerjr/praxis/actions/artifacts/13085994464/zip > "$RUNNER_TEMP/qualified-release-artifact.zip"
      - name: Exact runtime and bounded source regression checks
        run: python3 desk/tests/rc23_macos_source_delta.py prepare
      - uses: actions/cache/save@v4
        if: always() && steps.old.outputs.cache-hit != 'true' && hashFiles('evidence-rc23-source/RUNTIME-INPUT-VERIFIED.json') != ''
        with:
          path: ${{ runner.temp }}/qualified-release-artifact.zip
          key: helene-rc18-complete-baa533b05f4b63c6-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helene-rc23-macos-source-delta
          path: evidence-rc23-source/
