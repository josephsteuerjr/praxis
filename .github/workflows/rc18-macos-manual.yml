name: Hélène exact versioned manual archive with native OS extraction
on:
  push:
    branches: [codex/rc18-macos-0111]
    paths: [.github/workflows/rc18-macos-manual.yml]
permissions:
  contents: read
  actions: read
jobs:
  manual:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CANDIDATE_SHA256: baa533b05f4b63c69be3547122ae38fd21ca87012d68fea20445bd4b19da40f5
      ARTIFACT_SHA256: a2c375d594aaf31e7cf0f57b598a70a16473ce26dc8acb492ae44afd606970ae
      SKIP_DELTA_TRANSPORT: '1'
      RECHECK_MOVED_LOGIN: '1'
      NATIVE_DITTO_EXTRACT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: archive
        with:
          path: ${{ runner.temp }}/qualified-release-artifact.zip
          key: helene-rc18-complete-baa533b05f4b63c6-v2
      - if: steps.archive.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/josephsteuerjr/praxis/actions/artifacts/13085994464/zip > "$RUNNER_TEMP/qualified-release-artifact.zip"
      - name: Native extraction, exact modes, Cocoa lifecycle and moved-root login
        run: python3 desk/tests/macos_shared_regressions.py prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helene-rc18-manual-${{ matrix.os }}
          path: evidence-shared-mac/
