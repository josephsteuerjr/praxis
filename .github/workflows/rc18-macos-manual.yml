name: Hélène exact versioned manual archive with native OS extraction
on:
  push:
    branches: [codex/rc18-macos-0111]
    paths: [.github/workflows/rc18-macos-manual.yml]
permissions:
  contents: read
  actions: read
jobs:
  manual:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CANDIDATE_SHA256: 29414244dbac27a6ef5beac33a4b754db3db919523c30a6b02c0051f0b972758
      ARTIFACT_SHA256: e4ff88a30bbb533232be04bae9aa2a84081c0003fdde7b15714ffce61f2ee459
      SKIP_DELTA_TRANSPORT: '1'
      RECHECK_MOVED_LOGIN: '1'
      NATIVE_DITTO_EXTRACT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: archive
        with:
          path: ${{ runner.temp }}/qualified-release-artifact.zip
          key: helene-rc18-complete-29414244dbac27a6
      - if: steps.archive.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/josephsteuerjr/praxis/actions/artifacts/13085417762/zip > "$RUNNER_TEMP/qualified-release-artifact.zip"
      - name: Native extraction, exact modes, Cocoa lifecycle and moved-root login
        run: python3 desk/tests/macos_shared_regressions.py prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helene-rc18-manual-${{ matrix.os }}
          path: evidence-shared-mac/
