name: Hélène RC23 sealed archive rollback renderer proof
on:
  push:
    branches: [codex/rc23-macos-0211]
    paths: [.github/workflows/rc23-macos-rollback-visual.yml, desk/tests/rc23_macos_rollback_visual_qa.py]
permissions:
  contents: read
  actions: read
jobs:
  visual:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: subject
          ref: 2d6d8f63983747b6ef7ad300c2f0e9f08c4c1b51
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/qualified-release-artifact.zip
          key: helene-rc18-complete-baa533b05f4b63c6-v2
          fail-on-cache-miss: true
      - name: Reuse exact current archive; no product build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/josephsteuerjr/praxis/actions/artifacts/13105710108/zip > "$RUNNER_TEMP/rc23-candidate-artifact.zip"
      - name: Wait for the actual new renderer after full update and failed-start rollback
        run: python3 qa/desk/tests/rc23_macos_rollback_visual_qa.py prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helene-rc23-macos-rollback-visual
          path: evidence-rc23-package/
