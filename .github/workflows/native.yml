name: Helene 2.7.1 Beta native qualification
on:
  push:
    branches: [codex/helene271-device-arm-evidence-1311]
permissions:
  contents: write
jobs:
  server-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: josephsteuerjr/praxis-relay
          ref: 9dcbd61ff9006a4bef300510b061444498fabd95
          path: relay-source
          persist-credentials: false
      - name: Extract exact public source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,tarfile
          p=Path('inputs.tar.gz');n=json.loads(Path('PREPARED.json').read_bytes())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==n['archive_sha256']
          with tarfile.open(p) as z:z.extractall('qualification',filter='data')
          PY
      - name: Build and verify actual server installation
        run: python3 qualification/source/desk/installer/qualify_server_arm64.py --source qualification/source --relay-source relay-source --output server-result > server-build.log 2>&1
      - name: Preserve server package and evidence in draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p server-result/evidence
          cp server-build.log server-result/evidence/
          tail -50 server-build.log
          tar --exclude='evidence/native-relay-device/tree' --exclude='evidence/real-application-install/installed' --exclude='evidence/real-application-install/uploaded' --exclude='evidence/real-application-install/program.tar.gz' -czf r7-server-evidence.tar.gz -C server-result evidence
          gh release upload v2.7.1 r7-server-evidence.tar.gz
          for file in server-result/*.zip server-result/*.sha256; do
            if [ -f "$file" ]; then cp "$file" "r7-$(basename "$file")"; gh release upload v2.7.1 "r7-$(basename "$file")"; fi
          done
