name: Finish Beta Mac qualification on unchanged packages
on:
  push:
    branches: [codex/helene260-beta-mac-retry]
permissions:
  contents: write
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            runner: macos-15
          - target: macos-intel
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read completed candidate and prepare isolated case-sensitive fixture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download v2.6.0 --pattern 'native-${{ matrix.target }}.tar.gz' --dir prior
          hdiutil create -size 16g -type SPARSE -fs "Case-sensitive APFS" -volname HeleneCase "$RUNNER_TEMP/helene-case.sparseimage"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/helene-case" "$RUNNER_TEMP/helene-case.sparseimage"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,tarfile
          p=Path('inputs.tar.gz');n=json.loads(Path('PREPARED.json').read_bytes())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==n['archive_sha256']
          with tarfile.open(p) as z:z.extractall(Path(os.environ['RUNNER_TEMP'])/'helene-case/qualification',filter='data')
          PY
      - name: Retry failed rows and complete native checks
        run: python3 -B mac_retry.py --target ${{ matrix.target }} --root "$RUNNER_TEMP/helene-case/qualification" --prior 'prior/native-${{ matrix.target }}.tar.gz' > retry-driver.log 2>&1
      - name: Retain retry evidence and compact summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          cp retry-driver.log "$RUNNER_TEMP/helene-case/qualification/retry-evidence/driver.log"
          cp "$RUNNER_TEMP/helene-case/qualification/retry-evidence/summary.json" "retry-${TARGET}-summary.json"
          tar -czf "retry-${TARGET}.tar.gz" -C "$RUNNER_TEMP/helene-case/qualification" retry-evidence
          gh release upload v2.6.0 "retry-${TARGET}.tar.gz" "retry-${TARGET}-summary.json"
