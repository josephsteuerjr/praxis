name: Helene 2.7.0 Beta native qualification
on:
  push:
    branches: [codex/helene270-native-1211]
permissions:
  contents: write
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            runner: macos-15
            asset: Helene-2.6.1-macos-arm64.zip
          - target: macos-intel
            runner: macos-26-intel
            asset: Helene-2.6.1-macos-x86_64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download immutable qualified runtime and prepare case-sensitive workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.6.1 --repo josephsteuerjr/praxis --pattern '${{ matrix.asset }}' --dir donor
          hdiutil create -size 20g -type SPARSE -fs "Case-sensitive APFS" -volname HeleneCase "$RUNNER_TEMP/helene-case.sparseimage"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/helene-case" "$RUNNER_TEMP/helene-case.sparseimage"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,tarfile
          p=Path('inputs.tar.gz');n=json.loads(Path('PREPARED.json').read_bytes())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==n['archive_sha256']
          with tarfile.open(p) as z:z.extractall(Path(os.environ['RUNNER_TEMP'])/'helene-case/qualification',filter='data')
          PY
      - name: Build and qualify native package
        run: python3 -B "$RUNNER_TEMP/helene-case/qualification/equipment/mac_final.py" --target ${{ matrix.target }} --donors "$PWD/donor" > driver.log 2>&1
      - name: Preserve qualification in unpublished draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/helene-case/qualification/evidence"
          cp driver.log "$RUNNER_TEMP/helene-case/qualification/evidence/driver.log" || true
          tar -czf 'r2-native-${{ matrix.target }}.tar.gz' -C "$RUNNER_TEMP/helene-case/qualification" evidence
          gh release upload v2.7.0 'r2-native-${{ matrix.target }}.tar.gz'
