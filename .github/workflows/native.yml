name: Inspect Beta Mac qualification records
on:
  push:
    branches: [codex/helene260-beta-mac-diagnostics]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read both completed candidate records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download v2.6.0 --pattern 'native-macos*.tar.gz' --dir candidates
          python3 - <<'PY'
          from pathlib import Path
          import json,tarfile
          result={}
          for path in Path('candidates').glob('*.tar.gz'):
              with tarfile.open(path) as z:
                  rows=json.load(z.extractfile('evidence/native/regressions.json'))
                  failed=[r for r in rows if r['exit']]
                  result[path.name]={'failed':failed,'total_modules':len(rows),'logs':{r['module']:z.extractfile('evidence/native/'+r['module']+'.log').read().decode('utf8','replace')[-14000:] for r in failed}}
          Path('mac-diagnostics.json').write_text(json.dumps(result,indent=2))
          print(json.dumps({k:{'failed':v['failed'],'total_modules':v['total_modules']} for k,v in result.items()}))
          PY
          gh release upload v2.6.0 mac-diagnostics.json
