name: Helene 2.8.9 native qualification
on:
  push:
    branches: [codex/helene289-native-intel-retry]
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-intel
            runner: macos-26-intel
            asset: Helene-2.8.8-macos-x86_64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the qualified 2.8.8 runtime and prepare a case-sensitive workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir donor
          curl --fail --location --silent --show-error --retry 3 --retry-max-time 240 --max-time 180 \
            --output 'donor/${{ matrix.asset }}' \
            'https://github.com/josephsteuerjr/praxis/releases/download/v2.8.8/${{ matrix.asset }}'
          shasum -a 256 'donor/${{ matrix.asset }}'
          hdiutil create -size 20g -type SPARSE -fs "Case-sensitive APFS" -volname HeleneCase "$RUNNER_TEMP/helene-case.sparseimage"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/helene-case" "$RUNNER_TEMP/helene-case.sparseimage"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,tarfile
          p=Path('inputs.tar.gz');n=json.loads(Path('PREPARED.json').read_bytes())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==n['archive_sha256']
          with tarfile.open(p) as z:z.extractall(Path(os.environ['RUNNER_TEMP'])/'helene-case/qualification',filter='data')
          PY
      - name: Build and qualify the native package
        run: python3 -B "$RUNNER_TEMP/helene-case/qualification/equipment/mac_final.py" --target ${{ matrix.target }} --donors "$PWD/donor" > driver.log 2>&1
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/helene-case/qualification/evidence"
          cp driver.log "$RUNNER_TEMP/helene-case/qualification/evidence/driver.log" || true
          tail -60 driver.log || true
          tar -czf 'native-${{ matrix.target }}.tar.gz' -C "$RUNNER_TEMP/helene-case/qualification" evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.target }}
          path: native-${{ matrix.target }}.tar.gz
