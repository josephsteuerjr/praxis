name: Resume exact Hélène 2.8.5 Intel qualification
on:
  push:
    branches: [codex/helene285-intel-resume-1711]
permissions:
  contents: read
  actions: read
jobs:
  mac:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-intel
          path: prior-artifact
          run-id: 43949032981
          github-token: ${{ github.token }}
      - name: Prepare case-sensitive workspace
        run: |
          hdiutil create -size 20g -type SPARSE -fs "Case-sensitive APFS" -volname HeleneCase "$RUNNER_TEMP/helene-case.sparseimage"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/helene-case" "$RUNNER_TEMP/helene-case.sparseimage"
      - name: Requalify the exact archive with settled-result observation
        run: python3 -B resume.py > driver.log 2>&1
      - name: Collect exact package and evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/helene-case/qualification/evidence"
          cp driver.log "$RUNNER_TEMP/helene-case/qualification/evidence/driver.log" || true
          tail -60 driver.log || true
          tail -35 "$RUNNER_TEMP/helene-case/qualification/evidence/native-suite.log" || true
          python3 - <<'PY'
          from pathlib import Path
          import os,tarfile
          root=Path(os.environ['RUNNER_TEMP'])/'helene-case/qualification/evidence'
          with tarfile.open('intel-resume-proof.tar.gz','w:gz') as z:
            for p in sorted(root.rglob('*')):
              if not p.is_file():continue
              q=p.relative_to(root)
              if q.parts[0]=='package' or any(n in q.parts for n in ('regression-source','edition','test-home')):continue
              if q.parts[:2]==('native','core-work') and not(len(q.parts)==3 and p.suffix=='.json'):continue
              if q.parts[:3]==('native','relay-device','tree'):continue
              z.add(p,arcname='evidence/'+q.as_posix(),recursive=False)
          PY
          tar -czf native-macos-intel.tar.gz -C "$RUNNER_TEMP/helene-case/qualification" evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-macos-intel-proof
          path: intel-resume-proof.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-macos-intel
          path: native-macos-intel.tar.gz
