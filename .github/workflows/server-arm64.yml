name: Helene server ARM64 candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the bundled relay source pin
        id: relay
        run: python3 -c "import json,os; p=json.load(open('desk/localharness/relay-release.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('commit='+p['source_commit']+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: josephsteuerjr/praxis-relay
          ref: ${{ steps.relay.outputs.commit }}
          path: relay-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser clients from this source
        run: |
          for front in app remote miniapp mobile setup/ui; do
            npm --prefix "desk/$front" ci --ignore-scripts --no-audit --no-fund
          done
          for front in app remote miniapp mobile setup/ui; do
            npm --prefix "desk/$front" run build
          done
      - name: Native relay, complete archive and server qualification
        run: python3 desk/installer/qualify_server_arm64.py --source . --relay-source relay-source --output server-result > server-build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helene-server-arm64-candidate-${{ github.sha }}
          path: |
            server-result/*.zip
            server-result/*.sha256
            server-result/evidence/
            server-build.log
          retention-days: 14
