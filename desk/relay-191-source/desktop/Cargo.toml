[package]
name = "praxis-relay-desktop"
version = "1.0.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
praxis-relay = { path = ".." }
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
serde_json = "1"
sha2 = "0.10"
anyhow = "1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"

