<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio consumer regression</title><style>:root{--ink:#302c28;--ink-3:#80786e;--accent:#8a5439;--accent-ink:#fff;--line:#d8d0c5;--line-strong:#bdb2a3;--surface-2:#f2ece2;--paper:#faf6ee;--sans:system-ui;--shadow-pop:0 8px 30px #0002}body{background:var(--paper);color:var(--ink);font:16px/1.5 system-ui;margin:0;padding:24px}main{max-width:720px;margin:auto}#feed{padding-bottom:140px}.space{height:1000px}button,input,select{font:inherit}body.dark{--ink:#e5dccc;--ink-3:#ac9f8b;--paper:#25231f;--surface-2:#302c25;--line:#4c4439;--line-strong:#70614f;--accent:#d1a17a;--accent-ink:#251c15}</style><main><h2>Переписка · голос</h2><div id="feed"></div><button id="rerender">Перерисовать ленту</button><button id="theme">Тема</button><button id="dispose">Закрыть разговор</button></main><script type="module">
import '../ui-kit/paper-files.css';
import {paperMediaHTML,mountPaperMedia,mediaDescriptor} from '../ui-kit/paper-media';
import {setAudioPlayer} from '../ui-kit/paper-audio';
setAudioPlayer(()=>import('wavesurfer.js').then(m=>m.default));
function tone(){let rate=8000,n=rate*12,b=new ArrayBuffer(44+n*2),v=new DataView(b);function s(o,t){for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))}s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.sin(i*2*Math.PI*220/rate)*(2000+1000*Math.sin(i/rate*3)),true);return new Blob([b],{type:'audio/wav'})}
window.testAudio=[]; const NativeAudio=window.Audio; window.Audio=class extends NativeAudio {constructor(){super();window.testAudio.push(this)}};
const feed=document.querySelector('#feed'),blob=tone();let reads=0,retries=0;let voiceState={status:'error',error:'STT не настроен (синтетический сценарий)'};
function render(){feed.innerHTML='<p>Синтетический звуковой сигнал для проверки управления, не тест распознавания речи.</p>'+paperMediaHTML(mediaDescriptor({media_path:'memory/.control/desk_inbox/attachments/1/voice-one.webm',media_kind:'file',media_name:'Голосовое сообщение владельца',media_mime:'audio/webm'}))+'<p>Ответ агента · озвучка</p>'+paperMediaHTML({path:'media/artifacts/reply.wav',kind:'audio',name:'Ответ Джарвиса.wav'})+paperMediaHTML({path:'media/artifacts/report.pdf',kind:'file',name:'Длинный документ с результатом проверки и подробностями.pdf',size:183024})+'<div class="space"></div><p>Конец ленты</p>'}
render();const dispose=mountPaperMedia(feed,{key:m=>m.path,bytes:async()=>{reads++;return blob},save:async()=>{window.saved=true},voice:async(m,retry)=>{if(retry){retries++;voiceState={status:'ready',transcript:'Не устанавливать. Проверь только код.'}}return voiceState}});window.check={get reads(){return reads},get retries(){return retries},render,dispose};document.querySelector('#rerender').onclick=render;document.querySelector('#dispose').onclick=dispose;document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
</script></html>
