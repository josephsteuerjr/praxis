# Пульт Праксис: тем же окном владелец ходит в дерево агента на сервере.
#
# Запуск из каталога Пульта (сюда его кладёт `server/deploy_desk.py` вместе с
# пакетом — `/opt/praxisdesk/recipe/`):
#
#   docker compose -f /opt/praxisdesk/recipe/docker-compose.yml up -d --build
#
# Наружу канал выходит ТОЛЬКО на 127.0.0.1:8094; в мир его выпускает Caddy
# владельца (см. README-СЕРВЕР.md). Имя проекта — явное: без него compose берёт
# имя папки и на общем сервере видит в «своём» проекте чужие контейнеры.
# Никогда не запускать с --remove-orphans.
name: praxis-desk

services:
  desk:
    build:
      # Контекст — каталог Пульта: в нём лежит requirements-desk.txt пакета.
      context: ..
      dockerfile: recipe/Dockerfile
    image: praxis-desk:local
    container_name: praxis-desk
    restart: unless-stopped
    # Ключ канала, токены ботов и имена хостов — рядом с Пультом, вне
    # репозитория: это данные установки, а не продукта.
    env_file:
      - ../desk.env
    environment:
      # Дерево смонтировано в /data — канал читает только его.
      HELENE_TREE: /data
      # Своё состояние канала: ключи спаренных телефонов. В дерево их писать
      # нельзя — оно чужое и смонтировано на чтение, и до 09.09 телефон к
      # серверному Пульту не подключался вовсе: `/pair/redeem` падал
      # «Read-only file system» и отвечал 503.
      HELENE_DESK_STATE: /desk-state
      # Служба управления рядом (см. ниже). Адрес объявлен здесь, ключ приезжает
      # из `desk.env` (`HELENE_DESKCTL_TOKEN`) — как и остальные секреты
      # установки. Нет ключа — канал отвечает окну «управления контейнерами
      # здесь нет», и раздел не рисуется.
      HELENE_DESKCTL: http://deskctl:8096
    ports:
      - "127.0.0.1:${PRAXIS_DESK_PORT:-8094}:8094"
    volumes:
      # Дерево агента — ТОЛЬКО чтение: Пульт смотрит, а не правит.
      - ${PRAXIS_TREE_DIR:-/opt/praxis}:/data:ro
      # Два исключения, куда окно пишет: команды харнессу и записка владельца.
      - ${PRAXIS_TREE_DIR:-/opt/praxis}/memory/.control:/data/memory/.control
      - ${PRAXIS_TREE_DIR:-/opt/praxis}/workspace/inbox:/data/workspace/inbox
      # Сам пакет desk — тоже только чтение: его подменяет выкладка, не контейнер.
      - ${PRAXIS_DESK_DIR:-/opt/praxisdesk}:/desk:ro
      # Единственное место, куда канал пишет: ключи спаренных телефонов.
      # Рядом с Пультом, а не в дереве агента, и выкладка его не трогает.
      - ${PRAXIS_DESK_STATE:-/opt/praxisdesk-state}:/desk-state

  # Пультовой надзор: то, чего каналу знать не положено — контейнеры и докер.
  #
  # ⚠ Почему это ОТДЕЛЬНЫЙ контейнер, а не ручка канала. Канал читает чужое
  # дерево и говорит с окном; дать ему сокет докера значило бы дать окну ключ от
  # всей машины. Здесь сокет есть, но дверь узкая: список контейнеров закрыт
  # (`DESKCTL_CONTAINERS`), и ничего, кроме состояния, журнала и перезапуска,
  # служба не умеет. Наружу она не выходит — её порт виден только каналу.
  #
  # ⚠ И почему она не внутри агента: перезапуск нужен ровно тогда, когда агент
  # не отвечает. Файловый протокол в дереве в этот момент бесполезен — просьбу
  # некому взять.
  deskctl:
    image: praxis-desk:local
    container_name: praxis-deskctl
    restart: unless-stopped
    depends_on:
      - desk
    env_file:
      - ../desk.env
    environment:
      DESKCTL_TREE: /data
      DESKCTL_PORT: 8096
      # Кого этой службе позволено трогать. Всё, чего здесь нет, ей недоступно:
      # на общем сервере рядом живут чужие проекты.
      DESKCTL_CONTAINERS: ${PRAXIS_DESKCTL_CONTAINERS:-praxis,relay,praxis-desk}
      # ⚠ Ключ (`DESKCTL_TOKEN`) приходит ИЗ `desk.env`, а не интерполяцией:
      # compose подставляет `${…}` из `.env` рядом с СОБОЙ, то есть из каталога
      # рецепта, а он приезжает выкладкой пакета и переписывается ею. Секрет,
      # живущий в переписываемом каталоге, — потерянный секрет.
    volumes:
      # Докер хоста — единственный способ поднять упавший контейнер снаружи.
      - /var/run/docker.sock:/var/run/docker.sock
      # Мозг агента (`memory/llm.json`) — на запись: смена модели правит его.
      # Остальное дерево ей не нужно и не смонтировано.
      - ${PRAXIS_TREE_DIR:-/opt/praxis}/memory:/data/memory
      - ${PRAXIS_DESK_DIR:-/opt/praxisdesk}:/desk:ro
    # Адрес мозга в `llm.json` — `host.docker.internal`: чтобы спросить у него
    # живой список моделей, службе нужно то же имя, что и агенту. Без этой
    # строки список приходил пустым с честным «имя не разрешается».
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "/desk/deskctl.py"]
