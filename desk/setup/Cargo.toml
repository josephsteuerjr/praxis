[package]
name = "helene-setup"
version = "1.4.0"
edition = "2021"
description = "Установщик Hélène: motion-сцена первого запуска, имя агента, конституция, ключи, служба и установка в папку пользователя. Отдельный процесс от основной программы: одно окно, один экземпляр, закрыл окно = вышел."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
# 1.2: снимок памяти перед обновлением — zip (открывается Проводником и Finder'ом),
# хвост поставки сверяется по sha256.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# BCryptGenRandom для ключа реле (common/random_hex.rs) — как в shell и svc.
# 1.2: job-объект на детей мастера, поднятый исполнитель «для всех» (ShellExecuteExW runas).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Isolation", "Win32_System_Console", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# 1.2.3: ярлыки .lnk с AUMID — прямо через COM (common/shortcut_win.rs), без PowerShell и csc.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
# 1.2: поставка в хвосте установщика — tar, сжатый zstd (172 МБ против 261 МБ zip,
# распаковка ~2 с). Только Windows: на macOS установщик живёт в бандле рядом с поставкой.
zstd = { version = "0.13", default-features = false }
tar = { version = "0.4", default-features = false }
# Имя контейнера AppContainer — sha1 пути, как у fence.container_name.
sha1 = "0.10"

[profile.release]
opt-level = "z"
lto = true
strip = true

# Распаковка поставки и сверка её суммы — горячие места мастера: без этого «z» сжимает
# и их (распаковка 650 МБ шла бы в разы дольше).
[profile.release.package.zstd-sys]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3

# Без этой фичи Tauri считает сборку «dev» и грузит devUrl (localhost) вместо
# вшитой страницы. `tauri build` включает её сам; при `cargo build` — руками:
# cargo build --release --features custom-protocol
[features]
custom-protocol = ["tauri/custom-protocol"]
# 1.2: тот же мастер ставит Praxis (окно к агенту на своём сервере): имена продукта,
# praxis.exe, короткий маршрут. Сборка — setup/build-praxis.ps1 в свой target-praxis/.
praxis = []
