[package]
name = "helene"
version = "1.4.3"
edition = "2021"
description = "Frame — нативная оболочка основной программы: окно + WebView2, трей, уведомления, один экземпляр. Говорит с харнессом агента по frame.desk.v1: локально (дети окна) или удалённо."

[[bin]]
name = "helene"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "helene-host"
path = "src/bin/helene-host.rs"
required-features = ["host"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"], optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde_json = "1"
base64 = "0.22"
url = "2"
serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"], optional = true }
# native-certs: без него ureq носит с собой webpki-roots и не знает корней
# Windows — на машине с антивирусом, разбирающим TLS, «Проверить ключ» и
# «Проверить обновления» врали «Нет связи» там, где браузер работает.
# proxy-from-env/socks-proxy: за корпоративным прокси то же самое.
ureq = { version = "2", features = ["tls", "native-certs", "proxy-from-env", "socks-proxy"] }
# sha256 скачанного архива обновления (update_download): подписи кода у
# поставки нет, сумма из релиза — единственная проверка, что файл тот.
sha2 = "0.10"
# 1.2: копии памяти по расписанию (common/backup.rs) — zip, открывается Проводником.
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# libc — ради двух вещей, которых нет в std: `localtime_r` (штамп времени в
# helene.log и broker.log обязан быть местным, как у Windows-ветки с
# GetLocalTime; std умеет только UTC) и `killpg` (job-объекта на POSIX нет,
# детей останавливаем группой процессов, см. `stop_child`).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Уведомления macOS (Центр уведомлений) — то, что на Windows делает
# tauri-winrt-notification. Напрямую `notify-rust`, а не tauri-plugin-notification:
# у плагина `show()` отвечает `Ok(())` всегда (внутри `let _ = spawn(…)`), и отказ
# Центра уведомлений терялся бы без строки в журнале — см. `toast`.
notify-rust = "4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSWindow", "NSResponder", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Probe-only fixtures use public CGEvent fields -> real NSEvent conversion.
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["objc2-core-graphics"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2", features = ["v2_40"], optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tauri-winrt-notification = "0.7"
# Win32_System_SystemInformation — только ради GetLocalTime: журнал брокера
# (broker.log) пишут ДВЕ стороны, служба и окно, и время в нём обязано быть
# одним. У службы это тоже местное время (svc::now_stamp), а std умеет только UTC.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input", "Win32_System_LibraryLoader"] }
# 1.2.3: ярлыки .lnk с AUMID — прямо через COM (common/shortcut_win.rs), без PowerShell и csc.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[profile.release]
opt-level = "z"
lto = true
strip = true

# Без этой фичи Tauri считает сборку «dev» и грузит devUrl (localhost) вместо
# вшитой страницы. `tauri build` включает её сам; при `cargo build` — руками:
# cargo build --release --features custom-protocol
[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-window-state", "dep:tauri-plugin-single-instance", "dep:gtk", "dep:webkit2gtk"]
host = ["dep:tokio"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
