[package]
name = "helene"
version = "1.5.8"
edition = "2021"
description = "Frame вЂ” РЅР°С‚РёРІРЅР°СЏ РѕР±РѕР»РѕС‡РєР° РѕСЃРЅРѕРІРЅРѕР№ РїСЂРѕРіСЂР°РјРјС‹: РѕРєРЅРѕ + WebView2, С‚СЂРµР№, СѓРІРµРґРѕРјР»РµРЅРёСЏ, РѕРґРёРЅ СЌРєР·РµРјРїР»СЏСЂ. Р“РѕРІРѕСЂРёС‚ СЃ С…Р°СЂРЅРµСЃСЃРѕРј Р°РіРµРЅС‚Р° РїРѕ frame.desk.v1: Р»РѕРєР°Р»СЊРЅРѕ (РґРµС‚Рё РѕРєРЅР°) РёР»Рё СѓРґР°Р»С‘РЅРЅРѕ."

[[bin]]
name = "helene"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "helene-host"
path = "src/bin/helene-host.rs"
required-features = ["host"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"], optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde_json = "1"
base64 = "0.22"
url = "2"
serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"], optional = true }
# native-certs: Р±РµР· РЅРµРіРѕ ureq РЅРѕСЃРёС‚ СЃ СЃРѕР±РѕР№ webpki-roots Рё РЅРµ Р·РЅР°РµС‚ РєРѕСЂРЅРµР№
# Windows вЂ” РЅР° РјР°С€РёРЅРµ СЃ Р°РЅС‚РёРІРёСЂСѓСЃРѕРј, СЂР°Р·Р±РёСЂР°СЋС‰РёРј TLS, В«РџСЂРѕРІРµСЂРёС‚СЊ РєР»СЋС‡В» Рё
# В«РџСЂРѕРІРµСЂРёС‚СЊ РѕР±РЅРѕРІР»РµРЅРёСЏВ» РІСЂР°Р»Рё В«РќРµС‚ СЃРІСЏР·РёВ» С‚Р°Рј, РіРґРµ Р±СЂР°СѓР·РµСЂ СЂР°Р±РѕС‚Р°РµС‚.
# proxy-from-env/socks-proxy: Р·Р° РєРѕСЂРїРѕСЂР°С‚РёРІРЅС‹Рј РїСЂРѕРєСЃРё С‚Рѕ Р¶Рµ СЃР°РјРѕРµ.
ureq = { version = "2", features = ["tls", "native-certs", "proxy-from-env", "socks-proxy"] }
# sha256 СЃРєР°С‡Р°РЅРЅРѕРіРѕ Р°СЂС…РёРІР° РѕР±РЅРѕРІР»РµРЅРёСЏ (update_download): РїРѕРґРїРёСЃРё РєРѕРґР° Сѓ
# РїРѕСЃС‚Р°РІРєРё РЅРµС‚, СЃСѓРјРјР° РёР· СЂРµР»РёР·Р° вЂ” РµРґРёРЅСЃС‚РІРµРЅРЅР°СЏ РїСЂРѕРІРµСЂРєР°, С‡С‚Рѕ С„Р°Р№Р» С‚РѕС‚.
sha2 = "0.10"
# 1.2: РєРѕРїРёРё РїР°РјСЏС‚Рё РїРѕ СЂР°СЃРїРёСЃР°РЅРёСЋ (common/backup.rs) вЂ” zip, РѕС‚РєСЂС‹РІР°РµС‚СЃСЏ РџСЂРѕРІРѕРґРЅРёРєРѕРј.
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
# libc вЂ” СЂР°РґРё РґРІСѓС… РІРµС‰РµР№, РєРѕС‚РѕСЂС‹С… РЅРµС‚ РІ std: `localtime_r` (С€С‚Р°РјРї РІСЂРµРјРµРЅРё РІ
# helene.log Рё broker.log РѕР±СЏР·Р°РЅ Р±С‹С‚СЊ РјРµСЃС‚РЅС‹Рј, РєР°Рє Сѓ Windows-РІРµС‚РєРё СЃ
# GetLocalTime; std СѓРјРµРµС‚ С‚РѕР»СЊРєРѕ UTC) Рё `killpg` (job-РѕР±СЉРµРєС‚Р° РЅР° POSIX РЅРµС‚,
# РґРµС‚РµР№ РѕСЃС‚Р°РЅР°РІР»РёРІР°РµРј РіСЂСѓРїРїРѕР№ РїСЂРѕС†РµСЃСЃРѕРІ, СЃРј. `stop_child`).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# РЈРІРµРґРѕРјР»РµРЅРёСЏ macOS (Р¦РµРЅС‚СЂ СѓРІРµРґРѕРјР»РµРЅРёР№) вЂ” С‚Рѕ, С‡С‚Рѕ РЅР° Windows РґРµР»Р°РµС‚
# tauri-winrt-notification. РќР°РїСЂСЏРјСѓСЋ `notify-rust`, Р° РЅРµ tauri-plugin-notification:
# Сѓ РїР»Р°РіРёРЅР° `show()` РѕС‚РІРµС‡Р°РµС‚ `Ok(())` РІСЃРµРіРґР° (РІРЅСѓС‚СЂРё `let _ = spawn(вЂ¦)`), Рё РѕС‚РєР°Р·
# Р¦РµРЅС‚СЂР° СѓРІРµРґРѕРјР»РµРЅРёР№ С‚РµСЂСЏР»СЃСЏ Р±С‹ Р±РµР· СЃС‚СЂРѕРєРё РІ Р¶СѓСЂРЅР°Р»Рµ вЂ” СЃРј. `toast`.
notify-rust = "4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSWindow", "NSResponder", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Probe-only fixtures use public CGEvent fields -> real NSEvent conversion.
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["objc2-core-graphics"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2", features = ["v2_40"], optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tauri-winrt-notification = "0.7"
# Win32_System_SystemInformation вЂ” С‚РѕР»СЊРєРѕ СЂР°РґРё GetLocalTime: Р¶СѓСЂРЅР°Р» Р±СЂРѕРєРµСЂР°
# (broker.log) РїРёС€СѓС‚ Р”Р’Р• СЃС‚РѕСЂРѕРЅС‹, СЃР»СѓР¶Р±Р° Рё РѕРєРЅРѕ, Рё РІСЂРµРјСЏ РІ РЅС‘Рј РѕР±СЏР·Р°РЅРѕ Р±С‹С‚СЊ
# РѕРґРЅРёРј. РЈ СЃР»СѓР¶Р±С‹ СЌС‚Рѕ С‚РѕР¶Рµ РјРµСЃС‚РЅРѕРµ РІСЂРµРјСЏ (svc::now_stamp), Р° std СѓРјРµРµС‚ С‚РѕР»СЊРєРѕ UTC.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input", "Win32_System_LibraryLoader"] }
# 1.2.3: СЏСЂР»С‹РєРё .lnk СЃ AUMID вЂ” РїСЂСЏРјРѕ С‡РµСЂРµР· COM (common/shortcut_win.rs), Р±РµР· PowerShell Рё csc.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[profile.release]
opt-level = "z"
lto = true
strip = true

# Р‘РµР· СЌС‚РѕР№ С„РёС‡Рё Tauri СЃС‡РёС‚Р°РµС‚ СЃР±РѕСЂРєСѓ В«devВ» Рё РіСЂСѓР·РёС‚ devUrl (localhost) РІРјРµСЃС‚Рѕ
# РІС€РёС‚РѕР№ СЃС‚СЂР°РЅРёС†С‹. `tauri build` РІРєР»СЋС‡Р°РµС‚ РµС‘ СЃР°Рј; РїСЂРё `cargo build` вЂ” СЂСѓРєР°РјРё:
# cargo build --release --features custom-protocol
[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-window-state", "dep:tauri-plugin-single-instance", "dep:gtk", "dep:webkit2gtk"]
host = ["dep:tokio"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
